
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: New Features
      labels: [enhancement, feature]
    - title: Bug Fixes
      labels: [bug, fix]
    - title: Infrastructure & DevOps
      labels: [infrastructure, ci-cd, terraform, ansible]
    - title: Other Changes
      labels: ["*"]