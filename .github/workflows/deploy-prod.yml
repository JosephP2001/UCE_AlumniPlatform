name: Deploy to PROD
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests - jobs-service
        run: |
          cd apps/jobs-service
          npm install
          npm test

      - name: Run tests - auth-service
        run: |
          cd apps/auth-service
          npm install
          npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: josephp2001/uce-auth-service:latest

      - name: Build and push jobs-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/jobs-service
          push: true
          tags: josephp2001/uce-jobs-service:latest

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/PROD.pem
          chmod 400 ~/.ssh/PROD.pem
          cat >> ~/.ssh/config << EOF
          Host bastion-prod
            HostName ${{ secrets.PROD_BASTION_IP }}
            User ubuntu
            IdentityFile ~/.ssh/PROD.pem
            StrictHostKeyChecking no
          Host prod-private
            HostName ${{ secrets.PROD_AUTH_JOBS_IP }}
            User ubuntu
            IdentityFile ~/.ssh/PROD.pem
            ProxyJump bastion-prod
            StrictHostKeyChecking no
          EOF
          ssh-keyscan -H ${{ secrets.PROD_BASTION_IP }} >> ~/.ssh/known_hosts
          ssh prod-private "echo SSH ProxyJump OK"

      - name: Deploy via Ansible
        run: |
          pip install ansible
          ansible-playbook infra/ansible/deploy-prod.yml \
            -i "${{ secrets.PROD_AUTH_JOBS_IP }}," \
            --private-key ~/.ssh/PROD.pem \
            -u ubuntu \
            --ssh-extra-args="-o ProxyJump=ubuntu@${{ secrets.PROD_BASTION_IP }} -o StrictHostKeyChecking=no -i ~/.ssh/PROD.pem" \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "oauth_client_id=${{ secrets.OAUTH_CLIENT_ID }}" \
            -e "oauth_client_secret=${{ secrets.OAUTH_CLIENT_SECRET }}" \
            -e "pg_password=${{ secrets.PG_PASSWORD }}"