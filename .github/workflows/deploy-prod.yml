name: Deploy to PROD

on:
  push:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests - auth-service
        run: cd apps/auth-service && npm install && npm test

      - name: Run tests - jobs-service
        run: cd apps/jobs-service && npm install && npm test

      - name: Run tests - profile-service
        run: cd apps/profile-service && npm install && npm test

      - name: Run tests - notification-service
        run: cd apps/notification-service && npm install && npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: josephp2001/uce-auth-service:latest

      - name: Build and push jobs-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/jobs-service
          push: true
          tags: josephp2001/uce-jobs-service:latest

      - name: Build and push profile-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/profile-service
          push: true
          tags: josephp2001/uce-profile-service:latest

      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/notification-service
          push: true
          tags: josephp2001/uce-notification-service:latest

      - name: Build and push matching-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/matching-service
          push: true
          tags: josephp2001/uce-matching-service:latest

      - name: Build and push web-app
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-app
          push: true
          tags: josephp2001/uce-web-app:latest
          build-args: |
            NEXT_PUBLIC_AUTH_URL=http://josheponcepro1.distribuidauce.org
            NEXT_PUBLIC_JOBS_URL=http://josheponcepro1.distribuidauce.org
            NEXT_PUBLIC_PROFILE_URL=http://josheponcepro1.distribuidauce.org
            NEXT_PUBLIC_NOTIFICATIONS_URL=http://josheponcepro1.distribuidauce.org

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/PROD.pem
          chmod 400 ~/.ssh/PROD.pem
          ssh-keyscan -T 10 -H ${{ secrets.PROD_BASTION_IP }} >> ~/.ssh/known_hosts || true
          ssh -i ~/.ssh/PROD.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.PROD_BASTION_IP }} \
            "ssh-keyscan -H ${{ secrets.PROD_AUTH_JOBS_IP }}" >> ~/.ssh/known_hosts || true

      - name: Install Ansible
        run: pip install ansible

      - name: Create Ansible inventory
        run: |
          cat > /tmp/prod_inventory.ini << EOF2
          [prod_ec2]
          ${{ secrets.PROD_AUTH_JOBS_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/PROD.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/PROD.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.PROD_BASTION_IP }}"'
          EOF2

      - name: Deploy via Ansible
        run: |
          ansible-playbook infra/ansible/deploy-prod.yml \
            -i /tmp/prod_inventory.ini \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "oauth_client_id=${{ secrets.OAUTH_CLIENT_ID }}" \
            -e "oauth_client_secret=${{ secrets.OAUTH_CLIENT_SECRET }}" \
            -e "pg_password=${{ secrets.PG_PASSWORD }}" \
            -e "bastion_ip=${{ secrets.PROD_BASTION_IP }}" \
            -e "rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}"