name: Deploy to PROD

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: npm install

      - name: Build affected libraries
        run: npx nx affected -t build --base=HEAD~1 --head=HEAD

      - name: Run affected tests
        run: npx nx affected -t test --base=HEAD~1 --head=HEAD

  build-auth:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: josephp2001/uce-auth-service:latest

  build-jobs:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push jobs-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/jobs-service
          push: true
          tags: josephp2001/uce-jobs-service:latest

  build-profile:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push profile-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/profile-service
          push: true
          tags: josephp2001/uce-profile-service:latest

  build-notification:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/notification-service
          push: true
          tags: josephp2001/uce-notification-service:latest

  build-matching:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push matching-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/matching-service
          push: true
          tags: josephp2001/uce-matching-service:latest

  build-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push audit-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/audit-service/Dockerfile
          push: true
          tags: josephp2001/uce-audit-service:latest
  
  build-admin:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push admin-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/admin-service/Dockerfile
          push: true
          tags: josephp2001/uce-admin-service:latest

  build-analytics:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push analytics-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/analytics-service/Dockerfile
          push: true
          tags: josephp2001/uce-analytics-service:latest

  build-messaging:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push messaging-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/messaging-service
          push: true
          tags: josephp2001/uce-messaging-service:latest

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push web-app
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-app
          push: true
          tags: josephp2001/uce-web-app:latest
          build-args: |
            NEXT_PUBLIC_AUTH_URL=https://josheponcepro1.distribuidauce.org
            NEXT_PUBLIC_JOBS_URL=https://josheponcepro1.distribuidauce.org
            NEXT_PUBLIC_PROFILE_URL=https://josheponcepro1.distribuidauce.org
            NEXT_PUBLIC_NOTIFICATIONS_URL=https://josheponcepro1.distribuidauce.org
            NEXT_PUBLIC_MESSAGING_URL=https://josheponcepro1.distribuidauce.org

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-auth
      - build-jobs
      - build-profile
      - build-notification
      - build-matching
      - build-audit
      - build-analytics
      - build-messaging
      - build-admin
      - build-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Resolve PROD IPs dynamically
        id: prod_ips
        run: |
          ASG_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=uce-prod-asg-instance" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)
          BASTION_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=uce-prod-bastion" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          if [ "$ASG_IP" = "None" ] || [ -z "$ASG_IP" ]; then
            echo "::error::No se encontró instancia ASG running con tag uce-prod-asg-instance"
            exit 1
          fi
          if [ "$BASTION_IP" = "None" ] || [ -z "$BASTION_IP" ]; then
            echo "::error::No se encontró bastion running con tag uce-prod-bastion"
            exit 1
          fi

          echo "asg_ip=$ASG_IP" >> "$GITHUB_OUTPUT"
          echo "bastion_ip=$BASTION_IP" >> "$GITHUB_OUTPUT"
          echo "Resuelto: ASG=$ASG_IP  Bastion=$BASTION_IP"

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/PROD.pem
          chmod 400 ~/.ssh/PROD.pem
          ssh-keyscan -T 10 -H ${{ steps.prod_ips.outputs.bastion_ip }} >> ~/.ssh/known_hosts || true
          ssh -i ~/.ssh/PROD.pem -o StrictHostKeyChecking=no ubuntu@${{ steps.prod_ips.outputs.bastion_ip }} \
            "ssh-keyscan -H ${{ steps.prod_ips.outputs.asg_ip }}" >> ~/.ssh/known_hosts || true

      - name: Install Ansible
        run: pip install ansible

      - name: Create Ansible inventory
        run: |
          cat > /tmp/prod_inventory.ini << EOF2
          [prod_ec2]
          ${{ steps.prod_ips.outputs.asg_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/PROD.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/PROD.pem -o StrictHostKeyChecking=no ubuntu@${{ steps.prod_ips.outputs.bastion_ip }}"'
          EOF2

      - name: Deploy via Ansible
        run: |
          ansible-playbook infra/ansible/deploy-prod.yml \
            -i /tmp/prod_inventory.ini \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "oauth_client_id=${{ secrets.OAUTH_CLIENT_ID }}" \
            -e "oauth_client_secret=${{ secrets.OAUTH_CLIENT_SECRET }}" \
            -e "pg_password=${{ secrets.PG_PASSWORD }}" \
            -e "bastion_ip=${{ steps.prod_ips.outputs.bastion_ip }}" \
            -e "public_url=${{ secrets.PROD_PUBLIC_URL }}" \
            -e "n8n_basic_auth_password=${{ secrets.N8N_BASIC_AUTH_PASSWORD }}" \
            -e "n8n_encryption_key=${{ secrets.N8N_ENCRYPTION_KEY }}" \
            -e "rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}"