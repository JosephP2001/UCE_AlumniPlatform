name: Deploy to QA

on:
  push:
    branches:
      - QA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests - jobs-service
        run: |
          cd apps/jobs-service
          npm install
          npm test

      - name: Run tests - auth-service
        run: |
          cd apps/auth-service
          npm install
          npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: josephp2001/uce-auth-service:qa

      - name: Build and push jobs-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/jobs-service
          push: true
          tags: josephp2001/uce-jobs-service:qa

      - name: Build and push web-app
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-app
          push: true
          tags: josephp2001/uce-web-app:qa
          build-args: |
            NEXT_PUBLIC_AUTH_URL=http://${{ secrets.QA_BASTION_IP }}:3000
            NEXT_PUBLIC_JOBS_URL=http://${{ secrets.QA_BASTION_IP }}:3001

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_SSH_KEY }}" > ~/.ssh/QA.pem
          chmod 400 ~/.ssh/QA.pem
          ssh-keyscan -H ${{ secrets.QA_BASTION_IP }} >> ~/.ssh/known_hosts

      - name: Deploy via Ansible
        run: |
          pip install ansible
          ansible-playbook infra/ansible/deploy-qa.yml \
            -i "${{ secrets.QA_BASTION_IP }}," \
            --private-key ~/.ssh/QA.pem \
            -u ubuntu \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "oauth_client_id=${{ secrets.OAUTH_CLIENT_ID }}" \
            -e "oauth_client_secret=${{ secrets.OAUTH_CLIENT_SECRET }}" \
            -e "pg_password=${{ secrets.PG_PASSWORD }}"
