name: Deploy to QA

on:
  push:
    branches:
      - QA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests - auth-service
        run: cd apps/auth-service && npm install && npm test

      - name: Run tests - jobs-service
        run: cd apps/jobs-service && npm install && npm test

      - name: Run tests - profile-service
        run: cd apps/profile-service && npm install && npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: josephp2001/uce-auth-service:qa

      - name: Build and push jobs-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/jobs-service
          push: true
          tags: josephp2001/uce-jobs-service:qa

      - name: Build and push profile-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/profile-service
          push: true
          tags: josephp2001/uce-profile-service:qa

      - name: Build and push web-app
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-app
          push: true
          tags: josephp2001/uce-web-app:qa
          build-args: |
            NEXT_PUBLIC_AUTH_URL=http://${{ secrets.QA_BASTION_IP }}
            NEXT_PUBLIC_JOBS_URL=http://${{ secrets.QA_BASTION_IP }}
            NEXT_PUBLIC_PROFILE_URL=http://${{ secrets.QA_BASTION_IP }}

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_SSH_KEY }}" > ~/.ssh/QA.pem
          chmod 400 ~/.ssh/QA.pem
          ssh-keyscan -H ${{ secrets.QA_BASTION_IP }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/QA.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.QA_BASTION_IP }} \
            "ssh-keyscan -H ${{ secrets.QA_AUTH_JOBS_IP }}" >> ~/.ssh/known_hosts || true
            
      - name: Create Ansible inventory
        run: |
          cat > /tmp/qa_inventory.ini << EOF2
          [qa_ec2]
          ${{ secrets.QA_AUTH_JOBS_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/QA.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/QA.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.QA_BASTION_IP }}"'
          EOF2

      - name: Deploy via Ansible
        run: |
          pip install ansible
          ansible-playbook infra/ansible/deploy-qa.yml \
            -i /tmp/qa_inventory.ini \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "oauth_client_id=${{ secrets.QA_OAUTH_CLIENT_ID }}" \
            -e "oauth_client_secret=${{ secrets.QA_OAUTH_CLIENT_SECRET }}" \
            -e "pg_password=${{ secrets.PG_PASSWORD }}" \
            -e "rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}" \
            -e "bastion_ip=${{ secrets.QA_BASTION_IP }}"