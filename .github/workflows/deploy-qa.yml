name: Deploy to QA

on:
  push:
    branches:
      - QA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests - auth-service
        run: cd apps/auth-service && npm install && npm test

      - name: Run tests - jobs-service
        run: cd apps/jobs-service && npm install && npm test

      - name: Run tests - profile-service
        run: cd apps/profile-service && npm install && npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-service
          push: true
          tags: josephp2001/uce-auth-service:qa

      - name: Build and push jobs-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/jobs-service
          push: true
          tags: josephp2001/uce-jobs-service:qa

      - name: Build and push profile-service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/profile-service
          push: true
          tags: josephp2001/uce-profile-service:qa

      - name: Build and push web-app
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-app
          push: true
          tags: josephp2001/uce-web-app:qa
          build-args: |
            NEXT_PUBLIC_AUTH_URL=http://${{ secrets.QA_BASTION_IP }}
            NEXT_PUBLIC_JOBS_URL=http://${{ secrets.QA_BASTION_IP }}
            NEXT_PUBLIC_PROFILE_URL=http://${{ secrets.QA_BASTION_IP }}

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_SSH_KEY }}" > ~/.ssh/QA.pem
          chmod 400 ~/.ssh/QA.pem
          ssh-keyscan -T 10 -H ${{ secrets.QA_BASTION_IP }} >> ~/.ssh/known_hosts || true

      - name: Install Ansible
        run: pip install ansible

      - name: Create Ansible inventory
        env:
          QA_AUTH_JOBS_IP: ${{ secrets.QA_AUTH_JOBS_IP }}
          QA_BASTION_IP: ${{ secrets.QA_BASTION_IP }}
        run: |
          python3 - << 'PYEOF'
          import os
          host = os.environ['QA_AUTH_JOBS_IP']
          bastion = os.environ['QA_BASTION_IP']
          # Use double quotes around ProxyCommand, escape %h and %p
          inventory = (
              "all:\n"
              "  hosts:\n"
              "    qa_ec2:\n"
              f"      ansible_host: {host}\n"
              "      ansible_user: ubuntu\n"
              "      ansible_ssh_private_key_file: ~/.ssh/QA.pem\n"
              "      ansible_ssh_common_args: \"-o StrictHostKeyChecking=no"
              f" -o ProxyCommand='ssh -W %h:%p -i ~/.ssh/QA.pem"
              f" -o StrictHostKeyChecking=no ubuntu@{bastion}'\"\n"
          )
          with open('/tmp/qa_inventory.yml', 'w') as f:
              f.write(inventory)
          print(inventory)
          PYEOF

      - name: Debug inventory
        run: |
          echo "=== Raw inventory ==="
          cat /tmp/qa_inventory.yml
          echo "=== Test SSH through bastion ==="
          ssh -i ~/.ssh/QA.pem \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/QA.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.QA_BASTION_IP }}" \
            ubuntu@${{ secrets.QA_AUTH_JOBS_IP }} \
            "echo SSH_JUMP_OK && hostname" || echo "SSH jump failed"

      - name: Deploy via SSH direct to Bastion
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          QA_OAUTH_CLIENT_ID: ${{ secrets.QA_OAUTH_CLIENT_ID }}
          QA_OAUTH_CLIENT_SECRET: ${{ secrets.QA_OAUTH_CLIENT_SECRET }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          QA_BASTION_IP: ${{ secrets.QA_BASTION_IP }}
        run: |
          pip install ansible
          ansible-playbook infra/ansible/deploy-qa.yml \
            -i "${{ secrets.QA_BASTION_IP }}," \
            --private-key ~/.ssh/QA.pem \
            -u ubuntu \
            -e "jwt_secret=${JWT_SECRET}" \
            -e "oauth_client_id=${QA_OAUTH_CLIENT_ID}" \
            -e "oauth_client_secret=${QA_OAUTH_CLIENT_SECRET}" \
            -e "pg_password=${PG_PASSWORD}" \
            -e "rabbitmq_password=${RABBITMQ_PASSWORD}" \
            -e "bastion_ip=${{ secrets.QA_BASTION_IP }}"