---
- name: Deploy PROD services via SSH jump
  hosts: prod_ec2
  become: yes
  gather_facts: yes
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/PROD.pem
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/PROD.pem -o StrictHostKeyChecking=no ubuntu@{{ bastion_ip }}"
  tasks:

    # ── FREE DISK SPACE FIRST ──────────────────────────────────

    - name: Prune unused Docker images, containers, volumes and cache
      shell: docker system prune -af --volumes || true

    - name: Clean apt cache
      shell: apt-get clean && rm -rf /var/lib/apt/lists/* || true

    - name: Truncate large log files
      shell: |
        find /var/log -type f -name "*.log" -size +10M -exec truncate -s 0 {} \; || true
        journalctl --vacuum-size=50M || true

    # ── DOCKER SETUP ───────────────────────────────────────────

    - name: Remove broken Docker repository
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Remove broken Kubernetes repository
      file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent

    - name: Clean apt cache
      shell: apt-get clean && apt-get update --allow-insecure-repositories || true

    - name: Install dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present
        update_cache: yes

    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Remove old Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.gpg
        state: absent

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg

    - name: Remove old Docker repository
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Add Docker repository
      shell: |
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Docker network
      shell: docker network create uce-network || true

    # ── DATABASES ──────────────────────────────────────────────

    - name: Stop and remove postgres container
      shell: docker stop postgres && docker rm postgres || true

    - name: Run PostgreSQL container
      shell: |
        docker run -d \
          --name postgres \
          --network uce-network \
          --restart always \
          -e POSTGRES_DB=jobs_db \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD="{{ pg_password }}" \
          -v pg_data:/var/lib/postgresql/data \
          postgres:15-alpine

    - name: Stop and remove redis container
      shell: docker stop redis && docker rm redis || true

    - name: Run Redis container
      shell: |
        docker run -d \
          --name redis \
          --network uce-network \
          --restart always \
          -v redis_data:/data \
          redis:7-alpine

    - name: Wait for PostgreSQL to be ready
      shell: |
        for i in $(seq 1 15); do
          docker exec postgres pg_isready -U postgres && exit 0
          sleep 2
        done
        exit 1

    # ── SERVICES ───────────────────────────────────────────────

    - name: Stop and remove auth-service container
      shell: docker stop auth-service && docker rm auth-service || true

    - name: Stop and remove jobs-service container
      shell: docker stop jobs-service && docker rm jobs-service || true

    - name: Stop and remove profile-service container
      shell: docker stop profile-service && docker rm profile-service || true

    - name: Stop and remove web-app container
      shell: docker stop web-app && docker rm web-app || true

    - name: Pull auth-service image
      shell: docker pull josephp2001/uce-auth-service:latest

    - name: Pull jobs-service image
      shell: docker pull josephp2001/uce-jobs-service:latest

    - name: Pull profile-service image
      shell: docker pull josephp2001/uce-profile-service:latest

    - name: Pull web-app image
      shell: docker pull josephp2001/uce-web-app:latest

    - name: Run auth-service container
      shell: |
        docker run -d \
          --name auth-service \
          --network uce-network \
          --restart always \
          -e NODE_ENV=production \
          -e PORT=3000 \
          -e JWT_SECRET="{{ jwt_secret }}" \
          -e OAUTH_CLIENT_ID="{{ oauth_client_id }}" \
          -e OAUTH_CLIENT_SECRET="{{ oauth_client_secret }}" \
          -e REDIS_HOST=redis \
          -e REDIS_PORT=6379 \
          -e FRONTEND_URL=http://josheponcepro1.distribuidauce.org \
          josephp2001/uce-auth-service:latest

    - name: Run jobs-service container
      shell: |
        docker run -d \
          --name jobs-service \
          --network uce-network \
          --restart always \
          -e NODE_ENV=production \
          -e PORT=3001 \
          -e PG_HOST=postgres \
          -e PG_PORT=5432 \
          -e PG_DATABASE=jobs_db \
          -e PG_USER=postgres \
          -e PG_PASSWORD="{{ pg_password }}" \
          -e REDIS_HOST=redis \
          -e REDIS_PORT=6379 \
          -e JWT_SECRET="{{ jwt_secret }}" \
          josephp2001/uce-jobs-service:latest

    - name: Run profile-service container
      shell: |
        docker run -d \
          --name profile-service \
          --network uce-network \
          --restart always \
          -e NODE_ENV=production \
          -e PORT=3002 \
          -e POSTGRES_HOST=postgres \
          -e POSTGRES_PORT=5432 \
          -e POSTGRES_DB=jobs_db \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD="{{ pg_password }}" \
          -e JWT_SECRET="{{ jwt_secret }}" \
          josephp2001/uce-profile-service:latest

    - name: Run web-app container
      shell: |
        docker run -d \
          --name web-app \
          --network uce-network \
          --restart always \
          -e NODE_ENV=production \
          josephp2001/uce-web-app:latest

    # ── NGINX ──────────────────────────────────────────────────

    - name: Copy Nginx config to host
      copy:
        src: "{{ playbook_dir }}/../nginx/nginx.conf"
        dest: /home/ubuntu/nginx.conf
        mode: '0644'

    - name: Stop and remove nginx container
      shell: docker stop nginx && docker rm nginx || true

    - name: Run Nginx container
      shell: |
        docker run -d \
          --name nginx \
          --network uce-network \
          --restart always \
          -p 80:80 \
          -v /home/ubuntu/nginx.conf:/etc/nginx/nginx.conf:ro \
          nginx:alpine

    # ── VERIFY ─────────────────────────────────────────────────

    - name: Verify containers are running
      shell: docker ps
      register: docker_ps

    - name: Show running containers
      debug:
        var: docker_ps.stdout_lines
