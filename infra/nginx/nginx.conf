events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    upstream auth_service         { server auth-service:3000; }
    upstream jobs_service         { server jobs-service:3001; }
    upstream web_app              { server web-app:3002; }
    upstream profile_service      { server profile-service:3003; }
    upstream notification_service { server notification-service:3004; }
    upstream rabbitmq_mgmt        { server rabbitmq:15672; }
    upstream matching_service { server matching-service:3005; }

    server {
        listen 80;

        # ── Health checks ──────────────────────────────────
        location /api/auth/health {
            proxy_pass http://auth_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/jobs/health {
            proxy_pass http://jobs_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/profile/health {
            proxy_pass http://profile_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/notification/health {
            proxy_pass http://notification_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── API routes ─────────────────────────────────────
        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/jobs {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://jobs_service/jobs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/profile {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://profile_service/profile;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/notification/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://notification_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/matching/health {
            proxy_pass http://matching_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Swagger docs ───────────────────────────────────
        location /api/notification-docs {
            proxy_pass http://notification_service/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── RabbitMQ Management UI ─────────────────────────
        location /rabbitmq/ {
            proxy_pass http://rabbitmq_mgmt/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Frontend ───────────────────────────────────────
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}